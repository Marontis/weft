# PR gate for fleet-authored epics. The fleet publishes each epic to a
# branch and opens a PR; nothing reaches main until the required check is
# green — the merge-on-green contract, no direct pushes to main.
#
#   suite     — the full test suite (the fast Tier-1 equivalent on GitHub).
#               REQUIRED: a red suite blocks the merge.
#   mutation  — the scoped mutation sweep over the epic's claims,
#               REPORTING-ONLY: it publishes the per-claim mutation score
#               and the surviving mutants on every PR, so test adequacy is
#               measured and public instead of assumed. It never blocks;
#               thresholds can be layered on once real scores exist.
name: CI
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install node deps (lockfile only)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run the suite
        run: |
          if ls tests/*.test.mjs >/dev/null 2>&1; then
            node --test tests/*.test.mjs
          else
            echo "no test files yet — nothing to run."
          fi

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      ATTEST_STRYKER_CONCURRENCY: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install node deps (lockfile only)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the vendored attest engine (public deps only, no secret)
        # The engine is vendored at vendor/attest-kit, so a public clone/fork
        # runs the sweep with zero private-repo access. Only public deps
        # (mutmut/pydantic/pytest) come from PyPI.
        run: pip install --quiet ./vendor/attest-kit
      - name: Mutation scoreboard over the PR's claims (reporting-only)
        run: |
          # The epic's claim ids ride in attest-gate-request.json on the branch.
          # No request = a PR that scores no claims (e.g. the playground epic).
          if [ ! -f attest-gate-request.json ]; then
            echo "no attest-gate-request.json on this branch — no claims to score." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          CLAIMS=$(python -c "import json; print(' '.join(json.load(open('attest-gate-request.json')).get('claims', [])))")
          if [ -z "$(echo $CLAIMS | tr -d '[:space:]')" ]; then
            echo "gate request lists no claims — nothing to score." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "scoring claims: $CLAIMS"
          ARGS=""
          for c in $CLAIMS; do ARGS="$ARGS --claim $c"; done
          # Survivors are expected mid-project: record them, publish them,
          # do not block on them. A red *suite* is what blocks a merge.
          attest check $ARGS --record || echo "(survivors present — recorded and published below, not blocking)"
          python scripts/mutation_scoreboard.py >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the mutation record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attest-record
          path: attest-record.json
          if-no-files-found: ignore
